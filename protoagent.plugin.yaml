id: simple_kanban
name: Simple Kanban
version: 0.1.0
description: A durable ranked List/Kanban working queue for one operator and their agent.
enabled: false
repository: https://github.com/RomeoRaven/simple-kanban-plugin
homepage: https://github.com/RomeoRaven/simple-kanban-plugin
min_protoagent_version: 0.147.0
capabilities:
  network: []
  filesystem: instance-scoped plugin SQLite only
views:
  - id: kanban
    label: Kanban
    icon: Columns3
    placement: rail
    path: /plugins/simple_kanban/view
emits:
  - topic: changed
    summary: A Simple Kanban card was created, updated, moved, closed, reopened, archived, or deleted.
    schema:
      type: object
      required: [action, task_id, status, version]
      properties:
        action: {type: string}
        task_id: {type: string}
        status: {type: string}
        version: {type: integer}
subscribes: []
